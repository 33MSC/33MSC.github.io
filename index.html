<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="33MSC">
<title>33MSC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--green:#163f2b;--white:#f2f0e8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:"Roboto Mono",monospace;color:var(--white);cursor:default}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:#000;isolation:isolate;overflow:hidden}

/* The footage always remains 4:3. The black side space is intentional. */
video,.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
video{opacity:0;z-index:1;transition:opacity .72s cubic-bezier(.22,.8,.25,1)}
.poster{z-index:2;background:#000 url("start.jpg") center/contain no-repeat;transition:opacity .72s cubic-bezier(.22,.8,.25,1),transform 1.15s cubic-bezier(.2,.75,.2,1);}

/* Old-tape texture */
.stage:before,.stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4}
.stage:before{opacity:.18;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.08) 0,rgba(255,255,255,.08) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}
.stage:after{opacity:.09;background:radial-gradient(ellipse at center,transparent 42%,#000 100%),repeating-linear-gradient(90deg,transparent 0,transparent 3px,rgba(255,255,255,.04) 4px,transparent 5px);}
.poster:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.18) 62%,rgba(0,0,0,.78) 100%);pointer-events:none}
.poster:after{content:"";position:absolute;left:0;right:0;top:48%;height:1px;background:rgba(255,255,255,.16);box-shadow:0 0 18px rgba(255,255,255,.08);opacity:0;animation:tracking 6s linear infinite}

.ui{position:absolute;inset:0;z-index:5;display:grid;place-items:center;transition:opacity .5s ease,transform .75s cubic-bezier(.2,.8,.2,1)}
.enter{position:relative;margin-top:170px;min-width:164px;padding:15px 34px 13px;appearance:none;cursor:pointer;border:2px solid #111;background:#050505;color:#f5f3eb;font-family:"New Rocker",cursive;font-size:22px;letter-spacing:3px;line-height:1;text-shadow:2px 2px 0 #000;box-shadow:5px 5px 0 #0b0b0b,0 0 0 1px rgba(255,255,255,.2);transform:rotate(-1.2deg);transition:transform .16s ease,background .16s ease,color .16s ease,box-shadow .16s ease}
.enter:before,.enter:after{content:"";position:absolute;pointer-events:none}
.enter:before{inset:-7px 4px -5px -5px;border:1px solid rgba(255,255,255,.5);transform:rotate(2deg)}
.enter:after{inset:3px -4px -3px 5px;border-bottom:1px solid rgba(255,255,255,.32);transform:skewX(-12deg)}
.enter:hover{background:#eeeae0;color:#050505;transform:rotate(-2deg) scale(1.08);box-shadow:8px 8px 0 #080808,0 0 30px rgba(255,255,255,.13)}
.enter:active{transform:rotate(-1deg) scale(.97)}
.enter:focus-visible{outline:2px solid #fff;outline-offset:7px}
.hint{position:absolute;bottom:7.5%;font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.58);text-transform:uppercase}

.sound-control{position:fixed;right:20px;bottom:18px;z-index:7;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);color:#fff;padding:8px 10px;font:10px "Roboto Mono",monospace;letter-spacing:2px;opacity:0;pointer-events:none;transition:opacity .4s ease;cursor:pointer}
.playing .sound-control{opacity:.7;pointer-events:auto}

/* Click transition */
.glitch{animation:glitch .52s steps(2,end)}
.playing .poster{opacity:0;transform:scale(1.055);pointer-events:none}
.playing video{opacity:1}
.playing .ui{opacity:0;transform:scale(1.035);pointer-events:none}

@keyframes tracking{0%,92%{opacity:0;transform:translateY(-30vh)}94%{opacity:.8}100%{opacity:0;transform:translateY(30vh)}}
@keyframes glitch{0%{filter:none;transform:translate(0)}18%{filter:hue-rotate(25deg) contrast(1.7);transform:translate(-5px,1px)}32%{transform:translate(7px,-1px);clip-path:inset(10% 0 70% 0)}48%{filter:none;transform:translate(-2px,0);clip-path:none}65%{filter:contrast(1.5);transform:translate(3px,1px)}100%{filter:none;transform:none}}

@media(max-width:600px){
 .enter{margin-top:130px;min-width:145px;font-size:19px;padding:14px 28px 12px}
 .hint{bottom:9%;font-size:8px;letter-spacing:2px}
 .sound-control{right:12px;bottom:12px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Video intro">
  <video id="video" preload="auto" playsinline loop>
    <source src="33MSC.mp4" type="video/mp4">
  </video>
  <div class="poster" aria-hidden="true"></div>

  <section class="ui" id="ui">
    <button class="enter" id="enter" type="button" aria-label="Start video">BURN</button>
    <div class="hint">click to enter</div>
  </section>

  <button class="sound-control" id="sound" type="button" aria-label="Toggle sound">SOUND ON</button>
</main>

<script>
const stage = document.getElementById('stage');
const video = document.getElementById('video');
const enter = document.getElementById('enter');
const sound = document.getElementById('sound');

async function startExperience(){
  enter.disabled = true;
  stage.classList.add('glitch');
  window.setTimeout(() => stage.classList.remove('glitch'), 550);

  video.currentTime = 0;
  video.muted = false;

  try {
    await video.play();
  } catch (error) {
    /* Some browsers still block sound. Start the footage muted so the site isn't stuck. */
    video.muted = true;
    await video.play();
    sound.textContent = 'SOUND OFF';
  }

  stage.classList.add('playing');
}

enter.addEventListener('click', startExperience);

sound.addEventListener('click', () => {
  video.muted = !video.muted;
  sound.textContent = video.muted ? 'SOUND OFF' : 'SOUND ON';
});

/* Keyboard access */
enter.addEventListener('keydown', event => {
  if (event.key === 'Enter' || event.key === ' ') startExperience();
});
</script>
</body>
</html>
